# Fly.io config (runner-up host; see docs/DEPLOY-SERVER.md). `fly launch --no-deploy --copy-config`
# then `fly deploy --ha=false`. Set `app` to the name Fly gives you.
app = "phantom-escape-server"
primary_region = "sin"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  ALLOWED_ORIGINS = "https://hriday-shah.github.io"
  RECONNECT_SECONDS = "45"

[http_service]
  internal_port = 8080
  force_https = true
  # Rooms live in memory: never stop the machine while people play.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
