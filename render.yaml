# Render Blueprint for the Phantom Escape game server (free web service, Docker).
# This name (phantom-escape-server) is a different host from the live service
# phatom-escape (https://phatom-escape.onrender.com). See docs/DEPLOY-SERVER.md.
services:
  - type: web
    name: phantom-escape-server
    runtime: docker
    plan: free
    region: singapore          # closest Render region to India
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    # Redeploying drops every live room, so only redeploy when server code changes.
    # The Docker image also copies client/src/data and client/src/logic (house rules the server imports).
    buildFilter:
      paths:
        - server/**
        - client/src/lobby/lobby.ts
        - client/src/home/settings.ts
        - client/src/config/physicsConfig.ts
        - client/src/config/playerConfig.ts
        - client/src/data/**
        - client/src/logic/**
        - client/src/ui/phantomHideSlots.ts
        - scripts/check-docker-client-copy.mjs
        - package.json
        - package-lock.json
        - Dockerfile
        - .dockerignore
    envVars:
      # Browser origins allowed to connect (comma-separated). Add `localhost` for local testing.
      - key: ALLOWED_ORIGINS
        value: https://hriday-shah.github.io
      # Seconds a dropped player's seat is kept.
      - key: RECONNECT_SECONDS
        value: "30"
