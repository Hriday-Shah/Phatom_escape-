name: Docker client copy check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check-docker-client:
    name: Server Docker client modules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Verify Dockerfile copies server client imports
        run: npm run check:docker-client